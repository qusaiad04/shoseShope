<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jo shop</title>

    <style>
        .shop_name
        {
            font-size: 60px;
        }
        h1, p {
            font-family: 'Roboto', sans-serif;
            font-size: 20px;
            color: #333;
            margin-left: 50px;
            margin-right: 50px;
        }
        #name, #email, #message 
        {
            border: 1px solid #e60505;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="home.html">Home</a>
            <a href="product.html">Products</a>
            <a href="aboutUs.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
   <h1 class="shop_name">JO SHOP</h1>

   <section id="contact">
        <h1>Contact Us</h1>
        <p class="aboutWebsite">If you have any questions or concerns, please feel free to reach out to us. 
            You can contact us via filling out the form below.
            We will get back to you as soon as possible. Thank you for choosing us as your shopping 
            destination.</p>
            <div class="contact-form">
                <form class="contact-form">
                    <label for="name">Enter your name</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Enter your email</label>
                    <input type="email" id="email" name="email" required>
                    <label for="message">Enter your message</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                    <input type="submit" value="Submit">
                </form>
            </div>
            
   </section>
</body>
</html>
